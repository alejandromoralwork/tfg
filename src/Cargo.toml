[package]
name = "market_sim"
version = "0.1.0"
edition = "2021"

# Cargo.toml lives directly in this folder (not a level above it), so the
# binary entry point is `main.rs` here, not the default `src/main.rs`.
[[bin]]
name = "market_sim"
path = "main.rs"

# First (and only) external dependency this project has: gzip decoding for
# `simulate`'s real-data intake (data/order_statuses/**/*.gz). Hand-writing
# DEFLATE is not a reasonable alternative. rust_backend = miniz_oxide, pure
# Rust, no C/zlib toolchain needed.
[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
